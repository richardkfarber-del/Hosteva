services:
  - type: web
    name: hosteva-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python init_db.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hosteva-db
          property: connectionString
      - key: BILLING_ENABLED
        value: "false"
      # Placeholder for required production secrets (DO NOT HARDCODE VALUES HERE)
      # Configure these directly in the Render Dashboard:
      # - key: ENVIRONMENT
      #   value: production
      # - key: JWT_SECRET_KEY
      # - key: STRIPE_SECRET_KEY
      # - key: STRIPE_WEBHOOK_SECRET
      # - key: FRONTEND_URL
      # - key: ALLOWED_ORIGINS
      # - key: GEMINI_API_KEY
      # EPIC-AUTH (set in Render Dashboard; do not commit values):
      # - key: RESEND_API_KEY
      # - key: EMAIL_FROM   (alias RESEND_FROM)
      # - key: APP_BASE_URL
      # - key: EMAIL_SINK   (optional; production forces resend)
      # - key: PASSWORD_RESET_TTL_MINUTES  (optional; default 60)
      # - key: STRIPE_PRICE_PERMIT_FILING

      # BUG-PL-08 property images (R2 default / S3) — set in Render Dashboard; do not commit values:
      # - key: PROPERTY_IMAGE_PROVIDER          # r2 (default) | s3
      # - key: PROPERTY_IMAGE_BUCKET
      # - key: PROPERTY_IMAGE_ENDPOINT_URL      # required for R2
      # - key: PROPERTY_IMAGE_REGION            # auto (R2) or e.g. us-east-1
      # - key: PROPERTY_IMAGE_ACCESS_KEY_ID     # secret-request card
      # - key: PROPERTY_IMAGE_SECRET_ACCESS_KEY # secret-request card
      # - key: PROPERTY_IMAGE_PUBLIC_BASE_URL   # durable HTTPS prefix for DB image_url
      # - key: PROPERTY_IMAGE_KEY_PREFIX        # optional; default property-images/
      # - key: PROPERTY_IMAGE_LAZY_VERIFY       # optional; HEAD-check HTTPS on list

databases:
  - name: hosteva-db
    plan: free
    postgresMajorVersion: "15"
