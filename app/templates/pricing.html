<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pricing - Hosteva</title>
    <script src="https://cdn.tailwindcss.com?v=20260522"></script>
</head>
<body class="bg-gray-100">
    <div class="max-w-4xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
        <h2 class="text-3xl font-extrabold text-gray-900 text-center mb-8">Choose Your Plan</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Basic Plan -->
            <div class="bg-white rounded-lg shadow-lg p-6 flex flex-col">
                <h3 class="text-xl font-semibold mb-4">Basic</h3>
                <p class="text-gray-500 mb-4">For getting started</p>
                <p class="text-4xl font-bold mb-6">$0<span class="text-sm text-gray-500 font-normal">/mo</span></p>
                <ul class="mb-8 flex-1">
                    <li class="flex items-center mb-2">
                        <span class="text-green-500 mr-2">&#10003;</span> Basic Features
                    </li>
                </ul>
                <button class="w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600 transition-colors">Current Plan</button>
            </div>
            <!-- Pro Plan -->
            <div class="bg-white rounded-lg shadow-lg p-6 flex flex-col border-2 border-blue-500">
                <h3 class="text-xl font-semibold mb-4">Pro</h3>
                <p class="text-gray-500 mb-4">For growing hosts</p>
                <p class="text-4xl font-bold mb-6">$29<span class="text-sm text-gray-500 font-normal">/mo</span></p>
                <ul class="mb-8 flex-1">
                    <li class="flex items-center mb-2">
                        <span class="text-green-500 mr-2">&#10003;</span> All Basic Features
                    </li>
                    <li class="flex items-center mb-2">
                        <span class="text-green-500 mr-2">&#10003;</span> Premium Analytics
                    </li>
                </ul>
                <button class="w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600 transition-colors" onclick="checkout('pro')">Upgrade to Pro</button>
            </div>
            <!-- Premium Plan -->
            <div class="bg-white rounded-lg shadow-lg p-6 flex flex-col">
                <h3 class="text-xl font-semibold mb-4">Premium</h3>
                <p class="text-gray-500 mb-4">For power hosts</p>
                <p class="text-4xl font-bold mb-6">$99<span class="text-sm text-gray-500 font-normal">/mo</span></p>
                <ul class="mb-8 flex-1">
                    <li class="flex items-center mb-2">
                        <span class="text-green-500 mr-2">&#10003;</span> All Pro Features
                    </li>
                    <li class="flex items-center mb-2">
                        <span class="text-green-500 mr-2">&#10003;</span> Priority Support
                    </li>
                </ul>
                <button class="w-full bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600 transition-colors" onclick="checkout('premium')">Upgrade to Premium</button>
            </div>
        </div>
    </div>

    <script>
        async function checkout(tier) {
            try {
                const response = await fetch('/api/subscriptions/checkout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ tier: tier })
                });
                if (response.ok) {
                    const data = await response.json();
                    if (data.checkout_url) {
                        window.location.href = data.checkout_url;
                    } else {
                        alert('Error initiating checkout');
                    }
                } else {
                    if (response.status === 500 || response.status === 502) {
                        alert('Payment provider unavailable. Billing may not be configured in this environment.');
                    } else {
                        alert('Error initiating checkout');
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error initiating checkout');
            }
        }
    </script>
</body>
</html>
