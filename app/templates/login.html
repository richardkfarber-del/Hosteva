    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-headline { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #006576 0%, #1c7f92 100%);
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col relative overflow-hidden">
    <!-- TopAppBar Section -->
    <header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md">
        <div class="flex items-center justify-between px-6 py-4 max-w-full mx-auto">
            <a href="/" class="flex items-center gap-3">
                <img alt="Hosteva Logo" class="h-8 w-auto object-contain" src="/static/img/CleanLogo.png?v=20260522" onerror="this.onerror=null; this.src='https://placehold.co/200x80/006576/ffffff?text=Hosteva';">
                <span class="font-headline text-2xl font-extrabold tracking-tighter text-on-surface">Hosteva</span>
            </a>
            <div class="p-2 rounded-full hover:bg-surface-container-high/50 transition-all duration-300">
                <span class="material-symbols-outlined text-primary">room_service</span>
            </div>
        </div>
    </header>

    <!-- Main Content Canvas -->
    <main class="flex-grow flex items-center justify-center px-6 pt-24 pb-12">
        <div class="w-full max-w-md">
            <!-- Welcome Header Section -->
            <div class="mb-10 text-center">
                <h1 class="font-headline text-display-sm font-bold text-on-surface tracking-tight mb-2">Welcome Back</h1>
                <p class="font-body text-body-md text-on-surface-variant">Login to manage your portfolio</p>
            </div>
            
            <!-- Login Form Container -->
            <div class="bg-surface-container-lowest p-8 rounded-xl shadow-[0_20px_40px_rgba(0,28,55,0.04)] border border-outline-variant/15">
                <!-- Error Alert Box -->
                <div id="error-alert" class="hidden mb-6 p-4 rounded-lg bg-error-container border border-error/10 text-error text-sm flex items-start gap-2">
                    <span class="material-symbols-outlined text-md">error</span>
                    <span id="error-message">Invalid credentials. Please try again.</span>
                </div>

                <form id="login-form" class="space-y-6">
                    <!-- Email / Username Field -->
                    <div>
                        <label class="block font-label text-label-md font-semibold text-on-surface mb-2" for="username">Username or Email</label>
                        <input class="w-full px-4 py-3 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary-fixed-dim focus:bg-surface-bright transition-all text-on-surface placeholder-on-surface-variant/50 text-sm" id="username" name="username" placeholder="name@company.com" type="text" required/>
                    </div>
                    <!-- Password Field -->
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block font-label text-label-md font-semibold text-on-surface" for="password">Password</label>
                            <a class="text-label-sm font-medium text-primary hover:underline underline-offset-4 transition-all" href="#">Forgot Password?</a>
                        </div>
                        <div class="relative">
                            <input class="w-full px-4 py-3 bg-surface-container-low border-none rounded-lg focus:ring-2 focus:ring-primary-fixed-dim focus:bg-surface-bright transition-all text-on-surface placeholder-on-surface-variant/50 text-sm" id="password" name="password" placeholder="••••••••" type="password" required/>
                            <button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant/70" type="button" id="toggle-password-btn">
                                <span class="material-symbols-outlined text-[20px]">visibility</span>
                            </button>
                        </div>
                    </div>
                    <!-- Sign In Button -->
                    <button class="w-full py-4 rounded-lg btn-gradient text-on-primary font-bold shadow-lg active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" type="submit">
                        <span>Sign In</span>
                        <span id="spinner" class="hidden material-symbols-outlined animate-spin text-lg">progress_activity</span>
                    </button>
                </form>
                
                <!-- Divider -->
                <div class="relative my-8">
                    <div aria-hidden="true" class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-outline-variant/30"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-4 bg-surface-container-lowest text-on-surface-variant/70 font-label text-label-sm uppercase tracking-widest">Or continue with</span>
                    </div>
                </div>
                
                <!-- Social Login Buttons -->
                <div class="grid grid-cols-2 gap-4">
                    <button class="flex items-center justify-center gap-3 py-3 px-4 bg-surface-container-low hover:bg-surface-container-high rounded-lg transition-colors group" type="button">
                        <img alt="Google" class="w-5 h-5 grayscale group-hover:grayscale-0 transition-all" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB0pC8NihxNC7Q4PA8jYf2l1yuZNRHVwBz9Qsk8fv5bPAboQhphMzX7ttagzdrDaQD49yqzgbt0hyjdO58VW6i96Rbctz3LoJ12etTV9-ZMAa1bgMG9Mysb2sF0xREGJXGcEMjgDWYbL8-Mi-A4nenYNgy2uRh8kyRLHc9Bph7QxADjWPIAzDiGAryF7tDVuhoydSZca9ZA28iCIlwusrg01NG1e4__OBniPkp9snB_X8TWYWlUhnkR5l6yh86_vxgKYUWZOKw9I1E"/>
                        <span class="font-label text-label-md font-semibold text-on-surface">Google</span>
                    </button>
                    <button class="flex items-center justify-center gap-3 py-3 px-4 bg-surface-container-low hover:bg-surface-container-high rounded-lg transition-colors" type="button">
                        <span class="material-symbols-outlined text-on-surface" style="font-variation-settings: 'FILL' 1;">ios</span>
                        <span class="font-label text-label-md font-semibold text-on-surface">Apple</span>
                    </button>
                </div>
            </div>
            
            <!-- Footer Link -->
            <p class="mt-8 text-center text-on-surface-variant font-body">
                Don't have an account? 
                <a class="text-primary font-bold hover:underline underline-offset-4 transition-all" href="/register">Sign up</a>
            </p>
        </div>
    </main>

    <!-- Footer Section -->
    <footer class="bg-surface-container-low py-12">
        <div class="flex flex-col items-center px-8 gap-6 max-w-full mx-auto">
            <div class="font-headline text-lg font-bold text-on-surface">Hosteva</div>
            <div class="flex gap-6 text-label-sm font-body uppercase tracking-widest text-on-surface-variant/70">
                <a class="hover:text-primary transition-colors underline-offset-4 hover:underline" href="#">Privacy Policy</a>
                <a class="hover:text-primary transition-colors underline-offset-4 hover:underline" href="#">Terms</a>
                <a class="hover:text-primary transition-colors underline-offset-4 hover:underline" href="#">Support</a>
            </div>
            <p class="font-body text-label-sm text-on-surface-variant/50 mt-2">© 2026 Hosteva. The Intelligent Host.</p>
        </div>
    </footer>

    <!-- Form Submit Handler and Password Toggle Script -->
    <script>
        const form = document.getElementById('login-form');
        const alertBox = document.getElementById('error-alert');
        const errorMsg = document.getElementById('error-message');
        const spinner = document.getElementById('spinner');
        const togglePassBtn = document.getElementById('toggle-password-btn');
        const passInput = document.getElementById('password');

        // Simple micro-interaction for password visibility
        if (togglePassBtn && passInput) {
            const toggleIcon = togglePassBtn.querySelector('.material-symbols-outlined');
            togglePassBtn.addEventListener('click', () => {
                const isPass = passInput.type === 'password';
                passInput.type = isPass ? 'text' : 'password';
                if (toggleIcon) {
                    toggleIcon.textContent = isPass ? 'visibility_off' : 'visibility';
                }
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.classList.add('hidden');
            spinner.classList.remove('hidden');

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const params = new URLSearchParams();
                params.append('username', username);
                params.append('password', password);

                const response = await fetch('/api/user/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params
                });

                const data = await response.json();
                if (response.ok && data.access_token) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('access_token', data.access_token);
                    sessionStorage.setItem('token', data.access_token);
                    const q = new URLSearchParams(window.location.search);
                    let next = q.get('next');
                    const checkout = q.get('checkout');
                    const addressParam = q.get('address') || sessionStorage.getItem('pending_property_address') || '';
                    if (addressParam) {
                        sessionStorage.setItem('pending_property_address', addressParam);
                    }
                    // Only allow relative same-site paths
                    if (next && next.startsWith('/') && !next.startsWith('//')) {
                        if (checkout) {
                            const sep = next.includes('?') ? '&' : '?';
                            next = `${next}${sep}checkout=${encodeURIComponent(checkout)}`;
                        }
                        // US-002: if next is bare /dashboard and we still have an address, attach it
                        if (addressParam && (next === '/dashboard' || next.startsWith('/dashboard?'))) {
                            if (!next.includes('initial_address=')) {
                                const sep = next.includes('?') ? '&' : '?';
                                next = `${next}${sep}initial_address=${encodeURIComponent(addressParam)}`;
                            }
                        }
                        window.location.href = next;
                    } else if (checkout || addressParam) {
                        const parts = [];
                        if (addressParam) parts.push(`initial_address=${encodeURIComponent(addressParam)}`);
                        if (checkout) parts.push(`checkout=${encodeURIComponent(checkout)}`);
                        window.location.href = '/dashboard' + (parts.length ? '?' + parts.join('&') : '');
                    } else {
                        window.location.href = '/dashboard';
                    }
                } else {
                    errorMsg.textContent = data.detail || 'Login failed. Please try again.';
                    alertBox.classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
                errorMsg.textContent = 'A network error occurred. Please try again.';
                alertBox.classList.remove('hidden');
            } finally {
                spinner.classList.add('hidden');
            }
        });
    </script>

    <!-- Service Worker Registration -->
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('Service Worker registered: ', reg.scope))
                .catch(err => console.error('Service Worker registration failed: ', err));
        });
    }
    </script>
</body>
</html>
