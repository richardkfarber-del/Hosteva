<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Hosteva | Login</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <!-- Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'surface': '#f8f9ff',
                        'primary': '#006576',
                        'primary-container': '#1c7f92',
                        'on-surface': '#001c37',
                        'tertiary-fixed': '#75fbbf'
                    },
                    fontFamily: {
                        'headline': ['Manrope', 'sans-serif'],
                        'body': ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface font-body text-on-surface min-h-screen flex items-center justify-center relative overflow-hidden px-4">
    <!-- Background Decoration -->
    <div class="absolute top-[-20%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-gradient-to-tr from-primary/10 to-primary-container/20 blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[50vw] h-[50vw] rounded-full bg-gradient-to-br from-tertiary-fixed/15 to-primary/10 blur-[120px] pointer-events-none"></div>

    <div class="w-full max-w-md bg-white/70 backdrop-blur-xl rounded-2xl shadow-ambient border border-white/40 p-8 z-10 transition-all duration-300 hover:shadow-2xl">
        <div class="flex flex-col items-center mb-8">
            <a href="/" class="mb-4">
                <img src="/static/img/CleanLogo.png" alt="Hosteva Logo" class="h-16 w-auto max-w-full object-contain" onerror="this.onerror=null; this.src='https://placehold.co/200x80/006576/ffffff?text=Hosteva';">
            </a>
            <h1 class="text-2xl font-headline font-bold text-slate-800 tracking-tight text-center">Welcome Back</h1>
            <p class="text-sm text-slate-500 mt-1">Sign in to manage your STR compliance</p>
        </div>

        <div id="error-alert" class="hidden mb-6 p-4 rounded-xl bg-red-50 border border-red-100 text-red-600 text-sm flex items-start gap-2">
            <span class="material-symbols-outlined text-md">error</span>
            <span id="error-message">Invalid credentials. Please try again.</span>
        </div>

        <form id="login-form" class="space-y-5">
            <div>
                <label for="username" class="block text-sm font-semibold text-slate-700 mb-1.5">Username or Email</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">person</span>
                    <input id="username" name="username" type="text" required class="w-full bg-white/50 border border-slate-200 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" placeholder="Enter your username">
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label for="password" class="block text-sm font-semibold text-slate-700">Password</label>
                    <a href="#" class="text-xs font-medium text-primary-container hover:underline">Forgot password?</a>
                </div>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">lock</span>
                    <input id="password" name="password" type="password" required class="w-full bg-white/50 border border-slate-200 rounded-xl pl-10 pr-4 py-3 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" placeholder="••••••••">
                </div>
            </div>

            <div class="flex items-center">
                <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 rounded border-slate-300 text-primary focus:ring-primary">
                <label for="remember-me" class="ml-2 block text-sm text-slate-600">Remember me</label>
            </div>

            <button type="submit" class="w-full py-3 bg-gradient-to-r from-primary to-primary-container text-white font-headline font-bold rounded-xl shadow-md hover:opacity-95 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                <span>Sign In</span>
                <span id="spinner" class="hidden material-symbols-outlined animate-spin text-lg">progress_activity</span>
            </button>
        </form>

        <div class="mt-8 text-center border-t border-slate-100 pt-6">
            <p class="text-sm text-slate-600">Don't have an account? <a href="/register" class="font-bold text-primary hover:underline">Sign up</a></p>
        </div>
    </div>

    <script>
        const form = document.getElementById('login-form');
        const alertBox = document.getElementById('error-alert');
        const errorMsg = document.getElementById('error-message');
        const spinner = document.getElementById('spinner');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.classList.add('hidden');
            spinner.classList.remove('hidden');

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const params = new URLSearchParams();
                params.append('username', username);
                params.append('password', password);

                const response = await fetch('/api/user/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params
                });

                const data = await response.json();
                if (response.ok && data.access_token) {
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('access_token', data.access_token);
                    sessionStorage.setItem('token', data.access_token);
                    window.location.href = '/dashboard';
                } else {
                    errorMsg.textContent = data.detail || 'Login failed. Please try again.';
                    alertBox.classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
                errorMsg.textContent = 'A network error occurred. Please try again.';
                alertBox.classList.remove('hidden');
            } finally {
                spinner.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
