<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Reset password | Hosteva</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries&v=20260522"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
</head>
<body class="bg-[#f8f9ff] text-[#001c37] min-h-screen flex flex-col">
    <header class="px-6 py-4">
        <a href="/" class="font-semibold text-xl tracking-tight" style="font-family:Manrope,sans-serif">Hosteva</a>
    </header>
    <main class="flex-grow flex items-center justify-center px-6 pb-16">
        <div class="w-full max-w-md bg-white p-8 rounded-xl shadow border border-slate-100">
            <h1 class="text-2xl font-bold mb-2" style="font-family:Manrope,sans-serif">Set a new password</h1>
            <p class="text-sm text-slate-600 mb-6">At least 8 characters, not numbers only (max 128).</p>
            <div id="error-alert" class="hidden mb-6 p-4 rounded-lg bg-red-50 border border-red-100 text-red-700 text-sm"></div>
            <form id="reset-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-2" for="new_password">New password</label>
                    <input class="w-full px-4 py-3 bg-slate-50 rounded-lg text-sm" id="new_password" type="password" required autocomplete="new-password"/>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2" for="confirm_password">Confirm password</label>
                    <input class="w-full px-4 py-3 bg-slate-50 rounded-lg text-sm" id="confirm_password" type="password" required autocomplete="new-password"/>
                </div>
                <button class="w-full py-3 rounded-lg text-white font-bold" style="background:linear-gradient(135deg,#006576,#1c7f92)" type="submit">Update password</button>
            </form>
            <p class="mt-6 text-sm text-slate-600"><a class="text-[#006576] font-semibold hover:underline" href="/forgot-password">Request a new reset link</a></p>
        </div>
    </main>
    <script>
    (function () {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token') || '';
        if (window.history && window.history.replaceState) {
            window.history.replaceState({}, document.title, '/reset-password');
        }
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const error = document.getElementById('error-alert');
            error.classList.add('hidden');
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            if (!token) {
                error.textContent = 'This reset link is invalid or has expired. Request a new one.';
                error.classList.remove('hidden');
                return;
            }
            if (newPassword !== confirmPassword) {
                error.textContent = 'New password and confirmation do not match.';
                error.classList.remove('hidden');
                return;
            }
            try {
                const response = await fetch('/api/v1/users/password-reset/confirm', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: newPassword, confirm_password: confirmPassword })
                });
                const data = await response.json();
                if (response.ok) {
                    window.location.href = '/login?reset=1';
                } else {
                    error.textContent = (typeof data.detail === 'string') ? data.detail : 'Unable to reset password.';
                    error.classList.remove('hidden');
                }
            } catch (err) {
                error.textContent = 'A network error occurred. Please try again.';
                error.classList.remove('hidden');
            }
        });
    })();
    </script>
</body>
</html>
