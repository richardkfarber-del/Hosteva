<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Hosteva | Register</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <!-- Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries&v=20260522"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'surface': '#f8f9ff',
                        'primary': '#006576',
                        'primary-container': '#1c7f92',
                        'on-surface': '#001c37',
                        'tertiary-fixed': '#75fbbf'
                    },
                    fontFamily: {
                        'headline': ['Manrope', 'sans-serif'],
                        'body': ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-surface font-body text-on-surface min-h-screen flex items-center justify-center relative overflow-hidden px-4">
    <!-- Background Decoration -->
    <div class="absolute top-[-20%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-gradient-to-tr from-primary/10 to-primary-container/20 blur-[120px] pointer-events-none"></div>
    <div class="absolute bottom-[-20%] right-[-10%] w-[50vw] h-[50vw] rounded-full bg-gradient-to-br from-tertiary-fixed/15 to-primary/10 blur-[120px] pointer-events-none"></div>

    <div class="w-full max-w-md bg-white/70 backdrop-blur-xl rounded-2xl shadow-ambient border border-white/40 p-8 z-10 transition-all duration-300 hover:shadow-2xl">
        <div class="flex flex-col items-center mb-6">
            <a href="/" class="mb-4">
                <img src="/static/img/CleanLogo.png?v=20260522" alt="Hosteva Logo" class="h-16 w-auto max-w-full object-contain" onerror="this.onerror=null; this.src='https://placehold.co/200x80/006576/ffffff?text=Hosteva';">
            </a>
            <h1 class="text-2xl font-headline font-bold text-slate-800 tracking-tight text-center">Create Your Account</h1>
            <p class="text-sm text-slate-500 mt-1">Get started with intelligent STR compliance</p>
        </div>

        
        <div id="property-pending-banner" class="hidden mb-4 p-3.5 bg-primary/10 border border-primary/20 rounded-xl flex items-center gap-2 text-xs font-semibold text-primary">
            <span class="material-symbols-outlined text-base">home_pin</span>
            <span>Connecting property: <strong id="pending-address-text"></strong></span>
        </div>

        <div id="error-alert" class="hidden mb-6 p-4 rounded-xl bg-red-50 border border-red-100 text-red-600 text-sm flex items-start gap-2">
            <span class="material-symbols-outlined text-md">error</span>
            <span id="error-message">Registration failed. Please check details.</span>
        </div>

        <form id="register-form" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-semibold text-slate-700 mb-1">Username</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">person</span>
                    <input id="username" name="username" type="text" required class="w-full bg-white/50 border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" placeholder="johndoe">
                </div>
            </div>

            <div>
                <label for="email" class="block text-sm font-semibold text-slate-700 mb-1">Email Address</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">mail</span>
                    <input id="email" name="email" type="email" required class="w-full bg-white/50 border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" placeholder="john@example.com">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-semibold text-slate-700 mb-1">Password</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">lock</span>
                    <input id="password" name="password" type="password" required class="w-full bg-white/50 border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" placeholder="••••••••">
                </div>
            </div>

            <div>
                <label for="confirm-password" class="block text-sm font-semibold text-slate-700 mb-1">Confirm Password</label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-lg">lock</span>
                    <input id="confirm-password" name="confirm-password" type="password" required class="w-full bg-white/50 border border-slate-200 rounded-xl pl-10 pr-4 py-2.5 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-all" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="w-full py-3 mt-2 bg-gradient-to-r from-primary to-primary-container text-white font-headline font-bold rounded-xl shadow-md hover:opacity-95 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                <span>Sign Up</span>
                <span id="spinner" class="hidden material-symbols-outlined animate-spin text-lg">progress_activity</span>
            </button>
        </form>

        <div class="mt-6 text-center border-t border-slate-100 pt-4">
            <p class="text-sm text-slate-600">Already have an account? <a href="/login" class="font-bold text-primary hover:underline">Sign in</a></p>
        </div>
    </div>

    <script>
        const form = document.getElementById('register-form');
        const alertBox = document.getElementById('error-alert');
        const errorMsg = document.getElementById('error-message');
        const spinner = document.getElementById('spinner');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertBox.classList.add('hidden');

            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                errorMsg.textContent = 'Passwords do not match.';
                alertBox.classList.remove('hidden');
                return;
            }

            spinner.classList.remove('hidden');

            try {
                const response = await fetch('/api/user/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();
                if (response.ok) {
                    // Automatically log in the user after registration
                    const loginParams = new URLSearchParams();
                    loginParams.append('username', username);
                    loginParams.append('password', password);

                    const loginRes = await fetch('/api/user/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: loginParams
                    });

                    const loginData = await loginRes.json();
                    if (loginRes.ok && loginData.access_token) {
                        localStorage.setItem('token', loginData.access_token);
                        localStorage.setItem('access_token', loginData.access_token);
                        sessionStorage.setItem('token', loginData.access_token);

                        const urlParams = new URLSearchParams(window.location.search);
                        const addressParam = urlParams.get('address') || sessionStorage.getItem('pending_property_address') || '';
                        const planParam = urlParams.get('plan') || '';

                        let targetUrl = '/dashboard';
                        const queryParts = [];
                        if (addressParam) queryParts.push(`initial_address=${encodeURIComponent(addressParam)}`);
                        if (planParam === 'compliance_essentials') queryParts.push(`plan=compliance_essentials&checkout=prompt`);
                        
                        if (queryParts.length > 0) {
                            targetUrl += '?' + queryParts.join('&');
                        }
                        window.location.href = targetUrl;
                    } else {
                        window.location.href = '/login';
                    }
                } else {
                    errorMsg.textContent = data.detail || 'Registration failed. Please check details.';
                    alertBox.classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
                errorMsg.textContent = 'A network error occurred. Please try again.';
                alertBox.classList.remove('hidden');
            } finally {
                spinner.classList.add('hidden');
            }
        });
    </script>

    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('Service Worker registered: ', reg.scope))
                .catch(err => console.error('Service Worker registration failed: ', err));
        });
    }
    </script>
</body>
</html>
