<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Forgot password | Hosteva</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries&v=20260522"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
</head>
<body class="bg-[#f8f9ff] text-[#001c37] min-h-screen flex flex-col">
    <header class="px-6 py-4">
        <a href="/" class="font-semibold text-xl tracking-tight" style="font-family:Manrope,sans-serif">Hosteva</a>
    </header>
    <main class="flex-grow flex items-center justify-center px-6 pb-16">
        <div class="w-full max-w-md bg-white p-8 rounded-xl shadow border border-slate-100">
            <h1 class="text-2xl font-bold mb-2" style="font-family:Manrope,sans-serif">Forgot password</h1>
            <p class="text-sm text-slate-600 mb-6">Enter the email for your Hosteva account. If it exists, we will send reset instructions.</p>
            <div id="success-alert" class="hidden mb-6 p-4 rounded-lg bg-emerald-50 border border-emerald-100 text-emerald-800 text-sm">If an account exists for that email, we sent reset instructions.</div>
            <div id="error-alert" class="hidden mb-6 p-4 rounded-lg bg-red-50 border border-red-100 text-red-700 text-sm"></div>
            <form id="forgot-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-2" for="email">Email</label>
                    <input class="w-full px-4 py-3 bg-slate-50 rounded-lg text-sm" id="email" name="email" type="email" required placeholder="name@company.com"/>
                </div>
                <button class="w-full py-3 rounded-lg text-white font-bold" style="background:linear-gradient(135deg,#006576,#1c7f92)" type="submit">Send reset link</button>
            </form>
            <p class="mt-6 text-sm text-slate-600"><a class="text-[#006576] font-semibold hover:underline" href="/login">Back to sign in</a></p>
        </div>
    </main>
    <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const error = document.getElementById('error-alert');
        const ok = document.getElementById('success-alert');
        error.classList.add('hidden');
        ok.classList.add('hidden');
        try {
            const response = await fetch('/api/v1/users/password-reset/request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: document.getElementById('email').value })
            });
            const data = await response.json();
            if (response.ok) {
                ok.textContent = data.message || 'If an account exists for that email, we sent reset instructions.';
                ok.classList.remove('hidden');
            } else {
                error.textContent = (typeof data.detail === 'string') ? data.detail : 'Unable to process that request.';
                error.classList.remove('hidden');
            }
        } catch (err) {
            error.textContent = 'A network error occurred. Please try again.';
            error.classList.remove('hidden');
        }
    });
    </script>
</body>
</html>
