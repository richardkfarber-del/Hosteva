services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /opt/venv
      - /app/.venv
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=hosteva-api
      - OTEL_TRACES_EXPORTER=otlp
      # Vibranium Habit: Pass DB credentials via env
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/hosteva?sslmode=require}
    depends_on:
      - jaeger

  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      # Vibranium Habit: No hardcoded secrets in compose file
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-hosteva}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
    volumes:
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
      # Vibranium Habit: Persistent volume encrypted at rest
      - pgdata_encrypted:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-hosteva}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Dedicated pgvector container for agent memory (CHORE-034 - Verified)
  agent_memory_db:
    image: pgvector/pgvector:pg16
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${MEMORY_DB_USER:-agent_memory_user}
      POSTGRES_PASSWORD: ${MEMORY_DB_PASSWORD:-agent_memory_pass}
      POSTGRES_DB: ${MEMORY_DB_NAME:-agent_memory}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/etc/ssl/certs/ssl-cert-snakeoil.pem
      -c ssl_key_file=/etc/ssl/private/ssl-cert-snakeoil.key
    volumes:
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
      - agent_memory_pgdata_encrypted:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MEMORY_DB_USER:-agent_memory_user} -d ${MEMORY_DB_NAME:-agent_memory}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mcp-server-postgres:
    stdin_open: true
    tty: true
    image: node:20-alpine
    command: >
      sh -c '
      apk add --no-cache postgresql-client > /dev/null 2>&1 &&
      until psql "$${MEMORY_DATABASE_URL:-postgresql://agent_memory_user:agent_memory_pass@agent_memory_db:5432/agent_memory?sslmode=require}" -c "\q" > /dev/null 2>&1; do echo "Waiting for database..."; sleep 2; done &&
      echo "successful connection handshake with the pgvector database" &&
      NODE_TLS_REJECT_UNAUTHORIZED=0 npx -y @modelcontextprotocol/server-postgres "$${MEMORY_DATABASE_URL:-postgresql://agent_memory_user:agent_memory_pass@agent_memory_db:5432/agent_memory?sslmode=require}"
      '
    environment:
      - DATABASE_URL=${MEMORY_DATABASE_URL:-postgresql://agent_memory_user:agent_memory_pass@agent_memory_db:5432/agent_memory?sslmode=require}
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    depends_on:
      agent_memory_db:
        condition: service_healthy

  test_db:
    image: pgvector/pgvector:pg16
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test_db
    volumes:
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    tmpfs:
      - /var/lib/postgresql/data

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  pgdata_encrypted:
    # Vibranium Habit: Encrypted at rest
    driver: local
  agent_memory_pgdata_encrypted:
    # Vibranium Habit: Encrypted at rest
    driver: local

